<h1>Spectro — workflows</h1><p class="lead">Screenshots generated automatically by
<code>tools/workflow_screenshots.py</code> on the bundled demo project (paracetamol / caffeine /
aspirin; simulated spectra with realistic noise).</p><figure><img src='01_import.png' alt='Import from any instrument, Excel or CSV'><figcaption><b>1. Import from any instrument, Excel or CSV</b><br><span>one dialog reads text/CSV (any delimiter, decimal comma), Excel, JCAMP-DX and SPC exports; layout and names are detected and concentrations are filled from sample names — no manual re-typing.</span><br><i>How: File → Import spectra…</i></figcaption></figure>
<figure><img src='02_project.png' alt='Organize trials, standards, mixtures and samples'><figcaption><b>2. Organize trials, standards, mixtures and samples</b><br><span>every spectrum lives in one project file with its trial, role and concentrations; selecting spectra plots them instantly with a λ/A readout.</span><br><i>How: Project tree + plot</i></figcaption></figure>
<figure><img src='03_history.png' alt='Every operation logged per spectrum'><figcaption><b>3. Every operation logged per spectrum</b><br><span>the History tab lists each import, edit, processing step and calculation that touched this spectrum, with user, time and reason.</span><br><i>How: Select a spectrum → History tab</i></figcaption></figure>
<figure><img src='04_audit.png' alt='Tamper-evident audit trail'><figcaption><b>4. Tamper-evident audit trail</b><br><span>append-only, hash-chained log (ALCOA+ / Part 11 style): full parameters, input/output data hashes and before/after values; any tampering is detected by Verify integrity.</span><br><i>How: Audit → Audit trail</i></figcaption></figure>
<figure><img src='05_pipeline.png' alt='Processing pipelines with live preview'><figcaption><b>5. Processing pipelines with live preview</b><br><span>chain smoothing, baseline, derivatives, ratio spectra and spectrum resolution; results are new derived spectra — raw data is never changed and every result can be recomputed and verified.</span><br><i>How: Process → Processing pipeline…</i></figcaption></figure>
<figure><img src='06_stacked.png' alt='Stacked, difference and normalized views'><figcaption><b>6. Stacked, difference and normalized views</b><br><span>compare many spectra at a glance; difference view shows exactly how each spectrum departs from a reference.</span><br><i>How: View selector above the plot</i></figcaption></figure>
<figure><img src='07_optimizer_binary.png' alt='Method optimizer — binary mixture'><figcaption><b>7. Method optimizer — binary mixture</b><br><span>ranks every processing strategy (zero order, derivatives, dual wavelength, ratio methods, subtraction methods, Vierordt, bivariate, CLS, PLS) by predicted interference, noise and ±λ robustness, verified on simulated and laboratory mixtures — finds the best method in seconds instead of weeks.</span><br><i>How: Tools → Method optimizer</i></figcaption></figure>
<figure><img src='08_optimizer_ternary.png' alt='Method optimizer — ternary mixture'><figcaption><b>8. Method optimizer — ternary mixture</b><br><span>for three overlapping drugs it shows which strategies still work (multicomponent models, dual amplitude difference…) and which fail (zero-crossing), with the expected error of each.</span><br><i>How: Tools → Method optimizer (3 compounds)</i></figcaption></figure>
<figure><img src='09_univariate_setup.png' alt='Univariate methods — 22 templates'><figcaption><b>9. Univariate methods — 22 templates</b><br><span>pick a published method (ratio difference, derivative ratio, dual amplitude difference, ratio subtraction…), see the processed spectra and drag the λ markers to the best position.</span><br><i>How: Methods → Univariate calibration</i></figcaption></figure>
<figure><img src='10_univariate_calibration.png' alt='Calibration with full ICH statistics'><figcaption><b>10. Calibration with full ICH statistics</b><br><span>slope/intercept with SD and 95 % CI, r, Sy/x, LOD/LOQ and residual plot are computed automatically.</span><br><i>How: Calibrate</i></figcaption></figure>
<figure><img src='11_univariate_results.png' alt='Assay of mixtures and tablets'><figcaption><b>11. Assay of mixtures and tablets</b><br><span>found, taken and % recovery (or % label claim) with mean, SD and RSD — ready to paste into a paper or export to Excel.</span><br><i>How: Determine</i></figcaption></figure>
<figure><img src='12_standard_addition.png' alt='Standard addition inside the method'><figcaption><b>12. Standard addition inside the method</b><br><span>checks accuracy in the real matrix: recovery of each spike and the extrapolated content, with the same calibrated method.</span><br><i>How: Standard addition… (spiked samples)</i></figcaption></figure>
<figure><img src='13_robustness.png' alt='Robustness study in one click'><figcaption><b>13. Robustness study in one click</b><br><span>each parameter (λ, Δλ, plateau, window…) is varied by ±Δ, re-calibrated and re-assayed; the % deviation shows whether the method is robust (ICH Q2).</span><br><i>How: Robustness…</i></figcaption></figure>
<figure><img src='14_vierordt.png' alt='Simultaneous equations (Vierordt / bivariate / AUC)'><figcaption><b>14. Simultaneous equations (Vierordt / bivariate / AUC)</b><br><span>classic multi-wavelength methods with the coefficient matrix, its condition number and recoveries for every compound.</span><br><i>How: Methods → Equation methods</i></figcaption></figure>
<figure><img src='15_chemometrics_cv.png' alt='Chemometrics: cross-validation'><figcaption><b>15. Chemometrics: cross-validation</b><br><span>CLS, ILS, PCR, PLS, MCR-ALS, ANN and SVR with RMSECV curves and automatic choice of the number of components.</span><br><i>How: Methods → Chemometrics</i></figcaption></figure>
<figure><img src='16_chemometrics_prediction.png' alt='Chemometrics: prediction of validation mixtures and tablets'><figcaption><b>16. Chemometrics: prediction of validation mixtures and tablets</b><br><span>predicted-vs-actual plot, RMSEP and recoveries per compound.</span><br><i>How: Fit + predict</i></figcaption></figure>
<figure><img src='17_chemometrics_outliers.png' alt='Outlier detection with T² / Q limits'><figcaption><b>17. Outlier detection with T² / Q limits</b><br><span>95/99 % limits flag unusual calibration or sample spectra; one click excludes flagged spectra and refits. Fitted models are saved and exportable.</span><br><i>How: Outliers tab</i></figcaption></figure>
<figure><img src='18_validation.png' alt='ICH Q2(R2) validation statistics'><figcaption><b>18. ICH Q2(R2) validation statistics</b><br><span>linearity, LOD/LOQ, accuracy, precision/ANOVA, Student&#x27;s t, F-test and the interval hypothesis test — no spreadsheet formulas to check.</span><br><i>How: Tools → Validation statistics</i></figcaption></figure>
<figure><img src='19_design.png' alt='Calibration design for multivariate models'><figcaption><b>19. Calibration design for multivariate models</b><br><span>Brereton 5-level multifactor design with the volume of each stock solution to pipette — balanced, uncorrelated training mixtures.</span><br><i>How: Tools → Calibration design</i></figcaption></figure>
<figure><img src='20_greenness.png' alt='Greenness assessment (AGREE, Eco-Scale, GAPI)'><figcaption><b>20. Greenness assessment (AGREE, Eco-Scale, GAPI)</b><br><span>the greenness metrics journals ask for, with the pictogram, in the same tool as the analysis.</span><br><i>How: Tools → Greenness assessment</i></figcaption></figure>
<figure><img src='21_figure.png' alt='Publication-quality figures'><figcaption><b>21. Publication-quality figures</b><br><span>any plot → journal-ready TIFF/PNG (300–1200 dpi) or vector SVG/PDF/EPS, size in mm, fonts, black-and-white mode, with live preview.</span><br><i>How: Right-click a plot → Export publication figure</i></figcaption></figure>
<figure><img src='22_results.png' alt='Saved methods and results, Excel export'><figcaption><b>22. Saved methods and results, Excel export</b><br><span>every calibration and assay is stored with its method; results export to Excel (one sheet each) and methods to portable .spmodel files.</span><br><i>How: Methods → Saved methods &amp; results</i></figcaption></figure>
<figure><img src='23_report.png' alt='Trial report with audit trail'><figcaption><b>23. Trial report with audit trail</b><br><span>one click produces a PDF/HTML report: spectra, processing lineage, methods, results, integrity check and the audit trail.</span><br><i>How: File → Trial report</i></figcaption></figure></body></html>
