[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectro"
version = "0.1.0"
description = "UV/Vis spectral trial organizer and processing workbench for pharmaceutical analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0", "scipy>=1.13", "scikit-learn>=1.4", "PySide6>=6.6",
    "pyqtgraph>=0.13.7", "openpyxl>=3.1", "xlrd>=2.0", "olefile>=0.46",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
spectro = "spectro.ui.main_window:main"

[tool.setuptools.packages.find]
include = ["spectro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
