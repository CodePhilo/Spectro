name: Test and build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pytest hypothesis pyinstaller
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build executable
        run: >
          python -m PyInstaller --noconfirm --windowed --name Spectro
          --collect-submodules sklearn --collect-data sklearn --collect-data spectro
          --hidden-import scipy.special._cdflib --add-data "docs/methods;docs/methods"
          run_spectro.py
      - name: Self-check frozen executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Spectro\Spectro.exe -ArgumentList "--selfcheck" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-check failed ($($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: Spectro-windows
          path: dist/Spectro
